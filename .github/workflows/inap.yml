name: INAP Monitor

on:
  schedule:
    - cron: "*/10 * * * *"         # cada 10 minutos (UTC)
  workflow_dispatch: {}
  repository_dispatch:             # permite cron externo (POST a /dispatches)
    types: [external-cron]

permissions:
  contents: write                  # para poder hacer push del state/log

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid            # logs en hora local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Heartbeat para distinguir runs programados
      - name: Heartbeat (only when scheduled)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          echo "Scheduled heartbeat at $(date '+%Y-%m-%d %H:%M:%S %Z')"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🫀 Heartbeat: Scheduled run at $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Echo config
        run: |
          echo "Hora local runner: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "URL_TO_WATCH=${{ vars.URL_TO_WATCH }}"
          echo "MODE=${{ vars.MODE }}"
          echo "CSS_SELECTOR=${{ vars.CSS_SELECTOR }}"
          echo "Event=${{ github.event_name }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # opcional (uno)
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}     # coma-separada (varios)
          SNAPSHOT_SALT:    ${{ secrets.SNAPSHOT_SALT }}          # opcional para forzar cambios
          URL_TO_WATCH:     ${{ vars.URL_TO_WATCH }}              # p.ej. INAP o tu página de pruebas
          MODE:             ${{ vars.MODE }}                      # "text" o "links"
          CSS_SELECTOR:     ${{ vars.CSS_SELECTOR }}              # opcional
        run: python monitor_inap.py

      - name: Push state/log if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rev-parse --verify HEAD > /dev/null 2>&1 || exit 0
          git push

      - name: Upload hashes.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes-log
          path: hashes.log
          if-no-files-found: ignore
