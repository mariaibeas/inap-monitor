name: INAP Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external-cron]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor INAP
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_inap.py

      - name: Guardar cambios de estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state_inap.json hashes.log || true
          git diff --cached --quiet || git commit -m "Actualizar estado INAP"
          git push
